<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English">
<title>English Notes</title>
<meta name="theme-color" content="#2f6b5e">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#23211d;--mute:#6f6a60;--line:#e4dfd3;--acc:#2f6b5e;--accbg:#dcebe6;--warn:#b4572f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--card:#201f1c;--ink:#ece8de;--mute:#9b968a;--line:#34322c;--acc:#7cc4b0;--accbg:#27403a;--warn:#e69a72}}
:root[data-theme="dark"]{--bg:#171815;--card:#201f1c;--ink:#ece8de;--mute:#9b968a;--line:#34322c;--acc:#7cc4b0;--accbg:#27403a;--warn:#e69a72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,-apple-system,"SF Pro Text",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
h1{font:700 28px/1.2 Lora,Lora,Georgia,serif;margin:8px 0 4px}
h2{font:700 22px/1.25 Lora,Georgia,serif;margin:6px 0 12px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:24px 0 8px}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.bar{display:flex;gap:8px;margin:12px 0}
input[type=search],textarea{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
textarea{min-height:180px;font:14px/1.4 ui-monospace,Menlo,monospace}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 16px}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 14px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;font:inherit;cursor:pointer}
.item:active{transform:scale(.99)}
.item b{display:block;font-weight:600}.item small{color:var(--mute);font-size:13px}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent}
.dot.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px inherit;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.wide{width:100%;margin-top:10px}
.blk{margin:0 0 14px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);background:var(--accbg);white-space:nowrap}
tr:last-child td{border-bottom:0}
.ex{background:var(--card);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;margin:8px 0}
.ex em{display:block;color:var(--mute);font-style:normal;font-size:15px}
.note{background:var(--accbg);border-radius:12px;padding:12px 14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;max-width:200px;min-height:48px;border:0;border-radius:12px;background:none;color:var(--mute);font:600 14px inherit;cursor:pointer}
nav button.on{background:var(--accbg);color:var(--acc)}
.back{background:none;border:0;color:var(--acc);font:600 16px inherit;padding:10px 0;cursor:pointer;min-height:44px}
pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.msg{margin-top:10px;font-size:15px}.ok{color:var(--acc)}.err{color:var(--warn)}

:root{--k1:#2f7d5b;--k2:#2f6aa8;--k3:#a8701a;--k4:#7a4fa3;--b1:#e3f1ea;--b2:#e1ebf7;--b3:#f7ecd5;--b4:#ece4f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--k1:#7cc4a0;--k2:#8db8ea;--k3:#e6b866;--k4:#c2a0e6;--b1:#23352d;--b2:#232f40;--b3:#3b3322;--b4:#342b42}}
:root[data-theme="dark"]{--k1:#7cc4a0;--k2:#8db8ea;--k3:#e6b866;--k4:#c2a0e6;--b1:#23352d;--b2:#232f40;--b3:#3b3322;--b4:#342b42}
button,input,textarea{font-family:inherit}
table{font-size:15px;line-height:1.45}
th{padding:11px 12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);border-bottom:2px solid var(--acc)}
td{padding:12px}
tr:nth-child(even) td{background:color-mix(in srgb,var(--accbg) 40%,transparent)}
td:first-child{font-weight:700}
.sec{font:700 21px Lora,Georgia,serif;margin:32px 0 6px;padding-bottom:8px;border-bottom:2px solid var(--acc)}
.tg{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.tg table{min-width:760px;table-layout:fixed}
.tg th,.tg td{border-bottom:1px solid var(--line);vertical-align:top;white-space:normal}
.tg th{text-transform:none;letter-spacing:0;font-size:15px;font-weight:800;padding:12px 10px}
.tg th small{display:block;font-weight:600;font-size:12px;opacity:.85}
.tg th:first-child,.tg td:first-child{position:sticky;left:0;z-index:1;width:78px;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
.tg td{padding:14px 10px;background:none !important}
.tg .f{display:block;font-weight:800;font-size:16px;line-height:1.3;margin-bottom:6px}
.tg .e{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.tg th.c1{background:var(--b1);color:var(--k1);border-bottom:3px solid var(--k1)}.tg td.c1 .f{color:var(--k1)}
.tg th.c2{background:var(--b2);color:var(--k2);border-bottom:3px solid var(--k2)}.tg td.c2 .f{color:var(--k2)}
.tg th.c3{background:var(--b3);color:var(--k3);border-bottom:3px solid var(--k3)}.tg td.c3 .f{color:var(--k3)}
.tg th.c4{background:var(--b4);color:var(--k4);border-bottom:3px solid var(--k4)}.tg td.c4 .f{color:var(--k4)}
.tg tr:last-child td{border-bottom:0}
.cd{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.cd .n{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font:800 22px Lora,serif}
.cd .f{font-weight:800;font-size:16px;line-height:1.35}.cd .w{color:var(--mute);font-size:14px;margin-top:2px}.cd .e{margin-top:8px;font-size:15px}
.n.c1{background:var(--b1);color:var(--k1)}.n.c2{background:var(--b2);color:var(--k2)}.n.c3{background:var(--b3);color:var(--k3)}.n.c4{background:var(--b4);color:var(--k4)}
</style>
</head>
<body>
<main id="app"></main>
<nav><button data-v="home">Темы</button><button data-v="import">Импорт</button><button data-v="theme">Тема ◐</button></nav>

function home(){
 var L=all(),n=L.filter(function(t){return done[t.id]}).length,f=L.filter(function(t){return (t.title+" "+(t.desc||"")).toLowerCase().indexOf(q.toLowerCase())>-1});
 app.innerHTML='<h1>English Notes</h1><p class="sub">Выучено '+n+" из "+L.length+'</p><div class="prog"><i style="width:'+(L.length?n/L.length*100:0)+'%"></i></div><input type="search" id="s" placeholder="Поиск по темам" value="'+esc(q)+'">'+
 f.map(function(t){return '<button class="item" data-id="'+esc(t.id)+'"><span class="dot '+(done[t.id]?"on":"")+'">✓</span><span><b>'+esc(t.title)+"</b><small>"+esc(t.desc||"")+'</small></span><span class="tag">'+esc(t.tag||"")+"</span></button>"}).join("")||'<p class="sub">Ничего не найдено</p>';
 var s=document.getElementById("s");s.oninput=function(){q=s.value;var p=s.selectionStart;home();var e=document.getElementById("s");e.focus();e.setSelectionRange(p,p)};
 app.querySelectorAll(".item").forEach(function(b){b.onclick=function(){location.hash="t-"+b.dataset.id}});
}
function topic(id){
 var t=all().filter(function(x){return x.id===id})[0];if(!t)return home();
 app.innerHTML='<button class="back">‹ Все темы</button><h2>'+esc(t.title)+"</h2>"+(t.blocks||[]).map(block).join("")+'<button class="btn wide '+(done[id]?"":"pri")+'" id="dn">'+(done[id]?"Снять отметку «выучено»":"Отметить как выученное")+"</button>";
 app.querySelector(".back").onclick=function(){location.hash="home"};
 document.getElementById("dn").onclick=function(){done[id]=!done[id];sv("en_done",done);topic(id)};
 window.scrollTo(0,0);
}
function imp(){
 app.innerHTML='<h1>Импорт тем</h1><p class="sub">Отправь Claude фото конспекта вместе с этим запросом, получи JSON и вставь сюда.</p><button class="btn wide" id="cp">Скопировать запрос для Claude</button><h3>JSON</h3><textarea id="ta" placeholder=\'{"topics":[...]}\'></textarea><button class="btn pri wide" id="go">Добавить темы</button><label class="btn wide" style="display:grid;place-items:center">Загрузить файл .json<input type="file" id="fl" accept=".json,application/json" hidden></label><div class="msg" id="ms"></div><h3>Мои темы ('+custom.length+')</h3>'+
 (custom.map(function(t){return '<button class="item" data-del="'+esc(t.id)+'"><span><b>'+esc(t.title)+'</b><small>Нажми, чтобы удалить</small></span></button>'}).join("")||'<p class="sub">Пока нет добавленных тем</p>')+'<h3>Формат</h3><pre>'+esc(PROMPT)+"</pre>";
 var ms=document.getElementById("ms");
 function add(txt){try{var d=JSON.parse(txt),a=Array.isArray(d)?d:d.topics;if(!a||!a.length)throw 0;var c=0;a.forEach(function(t){if(t&&t.id&&t.title&&Array.isArray(t.blocks)){custom=custom.filter(function(x){return x.id!==t.id});custom.push(t);c++}});if(!c)throw 0;sv("en_custom",custom);imp();document.getElementById("ms").innerHTML='<span class="ok">Добавлено тем: '+c+"</span>"}catch(e){ms.innerHTML='<span class="err">Не получилось прочитать JSON. Проверь формат.</span>'}}
 document.getElementById("go").onclick=function(){add(document.getElementById("ta").value)};
 document.getElementById("fl").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){add(r.result)};r.readAsText(f)};
 document.getElementById("cp").onclick=function(){try{navigator.clipboard.writeText(PROMPT);ms.innerHTML='<span class="ok">Скопировано</span>'}catch(e){ms.innerHTML="Выдели и скопируй текст ниже"}};
 app.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){if(confirm("Удалить тему?")){custom=custom.filter(function(x){return x.id!==b.dataset.del});sv("en_custom",custom);imp()}}});
}
function route(){var h=location.hash.slice(1);document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===(h==="import"?"import":"home"))&&b.dataset.v!=="theme"});if(h==="import")imp();else if(h.indexOf("t-")===0)topic(h.slice(2));else home()}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){var v=b.dataset.v;if(v==="theme"){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark";try{localStorage.setItem("en_theme",r.dataset.theme)}catch(e){}}else location.hash=v}});
try{var th=localStorage.getItem("en_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
